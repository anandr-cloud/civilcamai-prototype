<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090D">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="logo.png">
<style>html,body{margin:0;padding:0;height:100%}</style>
</head>
<body>
<title>CivilCamAI Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: app shell — fixed left nav on desktop, top nav on phones; content column; drawers and dialogs over it.
   Single dark look, from the CivilCamAi design system (dark default). */
:root{
  --bg:#07090D; --surface:#0D1219; --raise:#131922; --line:#1B222C; --line2:#28303B; --side:#090C11; --active:#2A0A0F; --active-line:#7A1018;
  --fg:#F4F5F7; --fg2:#C9CDD3; --muted:#A0A7B1; --dim:#7D848E;
  --red:#E60B1D; --red-text:#FF5A63; --red-deep:#2A0508; --red-line:#6B1016; --red-wash:#14070A;
  --ok:#3CCB7F; --ok-bg:#0A1C12; --ok-line:#1E5C3A; --ok-text:#BFEBD2;
  --warn:#F5A524; --warn-bg:#1C1406; --warn-line:#6B4A10; --warn-text:#F3D9A4;
  --paper:#FFFFFF; --ink:#111418; --ink2:#4A515B;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--red-text)}
:focus-visible{outline:2px solid var(--red-text);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)} .dim{color:var(--dim)} .sm{font-size:13px} .xs{font-size:12px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em} h2{font-size:20px;font-weight:700} h3{font-size:16px;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.eyebrow.r{color:var(--red-text)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
/* shell — mirrors the CivilCamAi Consumer app: grouped sidebar, top bar, content */
.shell{display:flex;min-height:100%}
.nav{width:268px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brandmark{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);min-height:60px;text-decoration:none;color:var(--fg)}
.brandmark b{font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1}
.brandmark b em{font-style:normal;color:var(--red-text)}
.brandmark small{display:block;font-family:var(--f-mono);font-size:9px;letter-spacing:.24em;color:var(--muted);margin-top:4px}
.navlist{padding:6px 12px 20px;display:flex;flex-direction:column;gap:2px}
.nav .grp{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.16em;color:var(--dim);padding:20px 0 8px;text-transform:uppercase}
.nav a,.nav button.nl{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:var(--fg2);text-decoration:none;font-size:14px;border:1px solid transparent;background:none;cursor:pointer;width:100%;text-align:left}
.nav a svg,.nav button.nl svg{flex:none;color:var(--muted)}
.nav a>span:not(.nb),.nav button.nl>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nav a:hover,.nav button.nl:hover{background:var(--raise);color:var(--fg)}
.nav a.on{background:var(--active);border-color:var(--active-line);color:#fff;font-weight:600}
.nav a.on svg{color:#fff}
.nb{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.04em;padding:2px 7px;border-radius:10px;background:var(--red);color:#fff}
.content{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:flex-end;gap:12px;min-height:60px;background:rgba(7,9,13,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.pillbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--surface);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--fg)}
.iconbtn{position:relative;width:40px;height:40px;border-radius:20px;border:1px solid var(--line2);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--fg2)}
.iconbtn .dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.userchip{display:flex;align-items:center;gap:10px;border:1px solid var(--line2);background:var(--surface);border-radius:24px;padding:5px 12px 5px 5px;cursor:pointer;color:var(--fg)}
.avatar{width:34px;height:34px;border-radius:17px;background:#1C2A44;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line2);border-radius:10px;min-width:240px;padding:6px;box-shadow:0 20px 50px rgba(0,0,0,.6);display:flex;flex-direction:column;z-index:25}
.menu a,.menu button{padding:9px 12px;border-radius:6px;color:var(--fg);text-decoration:none;font-size:14px;background:none;border:0;text-align:left;cursor:pointer}
.menu a:hover,.menu button:hover{background:var(--raise)}
.burger{display:none}
.main{flex:1;min-width:0;padding-block:36px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1540px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
@media (min-width:861px){.main{padding-left:max(56px,env(safe-area-inset-left,0px));padding-right:max(56px,env(safe-area-inset-right,0px))}}
@media (max-width:860px){
  .nav{position:fixed;left:0;top:0;bottom:0;z-index:45;transform:translateX(-100%);transition:transform .2s;box-shadow:20px 0 60px rgba(0,0,0,.6);padding-left:env(safe-area-inset-left,0px)}
  .nav.open{transform:none}
  .burger{display:flex;margin-right:auto}
  .hide-sm{display:none!important}
}
.spec{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;border:1px dashed var(--line2);color:var(--muted);white-space:nowrap}
.hero{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);min-height:330px;display:flex;align-items:center;background:#0B0F15}
.hero .img{position:absolute;inset:0;background:url(stadium.jpg) right center/cover no-repeat}
.hero .shade{position:absolute;inset:0;background:linear-gradient(90deg,#0B0F15 0%,#0B0F15 30%,rgba(11,15,21,.78) 50%,rgba(11,15,21,.15) 80%)}
.hero .copy{position:relative;padding:32px;display:flex;flex-direction:column;gap:14px;max-width:440px}
.hero .big{font-size:clamp(30px,3.4vw,40px);font-weight:800;line-height:1.08;letter-spacing:-.02em}
@media (max-width:640px){.hero .shade{background:linear-gradient(180deg,rgba(11,15,21,.55),#0B0F15 75%)}}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.viewall{font-size:12px;font-weight:700;color:var(--red-text);text-decoration:none;background:none;border:0;cursor:pointer}
.evrow{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);cursor:pointer;text-align:left;width:100%;color:var(--fg)}
.evrow:hover{border-color:var(--line2)}
.evthumb{width:80px;height:56px;border-radius:6px;flex:none;background:url(stadium.jpg) center/cover;filter:saturate(.8)}
.evthumb.alt{background:linear-gradient(135deg,#1C2A44,#0B0F15)}
.chip.blue,.blue{border-color:#1F3A6B;background:#0C1830;color:#8FB4FF}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
@media (max-width:1100px){.cols3{grid-template-columns:1fr}}
.home-top{display:grid;grid-template-columns:minmax(0,2.5fr) minmax(280px,1fr);gap:22px}
@media (max-width:1100px){.home-top{grid-template-columns:1fr}}
.secic{width:30px;height:30px;border-radius:7px;border:1px solid var(--line2);background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none}
.sectitle{font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--fg)}
.evgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
@media (max-width:1100px){.evgrid{grid-template-columns:repeat(2,minmax(0,1fr))}} @media (max-width:700px){.evgrid{grid-template-columns:1fr}}
.evcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;padding:0;cursor:pointer;color:var(--fg);text-align:left}
.evcard:hover{border-color:var(--line2)}
.evimg{position:relative;height:230px;background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:space-between;padding:12px 16px}
.evimg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,9,13,0) 35%,var(--surface) 100%)}
.evimg>*{position:relative;z-index:1} .evimg>.chip{align-self:flex-start}
.evcap{display:flex;flex-direction:column;gap:4px}
.tabbtn{min-height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--line2);background:var(--surface);color:var(--fg);font-weight:600;font-size:13px;cursor:pointer}
.tabbtn.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg2{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg2 button{min-height:36px;padding:0 12px;border:0;background:var(--surface);color:var(--muted);font-size:13px;cursor:pointer} .seg2 button.on{background:var(--raise);color:var(--fg)}
.dlitem{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--bg);cursor:pointer;color:var(--fg);width:100%}
.dlitem:hover{border-color:var(--line2)}
.evhero{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0B0F15}
.evhero .img{position:absolute;inset:0 0 auto 0;height:62%;background-size:cover;background-position:center}
.evhero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,15,21,.25),#0B0F15 62%)}
.htiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:900px){.htiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.htile{border:1px solid var(--line2);background:rgba(13,18,25,.85);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.evgrid2{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(300px,1fr);gap:22px;align-items:start}
@media (max-width:1100px){.evgrid2{grid-template-columns:1fr}}
.lanes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:700px){.lanes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lane{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.plog{background:#030405;border:1px solid var(--line);border-radius:8px;min-height:180px;max-height:260px;overflow:auto;padding:12px;font-family:var(--f-mono);font-size:11px;color:var(--fg2);display:flex;flex-direction:column;gap:4px}
.frow2{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.itile{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px}
#pstats{grid-template-columns:repeat(5,minmax(0,1fr))} @media (max-width:900px){#pstats{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
.startwrap{min-height:100%;padding-block:48px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(1200px 500px at 85% -10%,rgba(230,11,29,.14),transparent 60%),var(--bg)}
.starttiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:980px){.starttiles{grid-template-columns:1fr}}
.stile{display:flex;flex-direction:column;align-items:flex-start;gap:18px;padding:24px;border-radius:14px;border:1px solid var(--line2);background:var(--surface);color:var(--fg);cursor:pointer;min-height:420px;text-align:left;transition:border-color .15s,transform .15s}
.stile:hover{border-color:var(--active-line);transform:translateY(-2px)}
.mwrap{min-height:100%;display:flex;gap:40px;justify-content:center;align-items:flex-start;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mguide{width:340px;flex:none;display:flex;flex-direction:column;gap:18px;position:sticky;top:32px}
.gitem{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);color:var(--fg);cursor:pointer}
.gitem:hover{border-color:var(--line2)}
.phone{width:390px;height:min(812px,calc(100vh - 64px));min-height:640px;flex:none;border-radius:44px;border:10px solid #1A1F27;background:var(--bg);box-shadow:0 30px 80px rgba(0,0,0,.7),inset 0 0 0 1px #2B323C;position:relative;overflow:hidden;display:flex;flex-direction:column}
.pstatus{height:40px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:13px;font-weight:700;color:var(--fg)}
.sigbtn{background:none;border:0;color:var(--fg);font-size:11px;font-weight:700;cursor:pointer;letter-spacing:-1px}
.mscreen{flex:1;overflow-y:auto;display:flex;flex-direction:column;position:relative}
.mtop{display:flex;align-items:center;gap:8px;padding:8px 14px;min-height:48px;position:sticky;top:0;background:rgba(7,9,13,.9);backdrop-filter:blur(6px);z-index:2}
.mbtnicon{width:36px;height:36px;border-radius:18px;border:1px solid var(--line2);background:var(--surface);color:var(--fg);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mbody{flex:1;display:flex;flex-direction:column;gap:14px;padding:6px 18px 22px}
.mcenter{align-items:center;justify-content:center;text-align:center}
.mfail{width:58px;height:58px;border-radius:29px;border:2px solid var(--red-line);background:#1A0507;color:var(--red-text);font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center}
.mbig{display:flex;align-items:center;gap:14px;border:1px solid var(--line2);border-radius:12px;padding:16px;background:var(--surface);color:var(--fg);cursor:pointer;text-align:left;width:100%}
.mbig:hover{border-color:var(--active-line)}
.mhero{margin:0 -18px;padding:70px 18px 12px;background-size:cover;background-position:center;display:flex;flex-direction:column;gap:4px}
.mtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:8px}
.mtile{min-height:88px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:13px;color:var(--fg);cursor:pointer}
.mtile:hover{border-color:var(--active-line)}
.mrow{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.mfoot{position:sticky;bottom:0;padding:12px 18px 18px;background:linear-gradient(180deg,rgba(7,9,13,0),var(--bg) 30%);z-index:2}
.mgrid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mscrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:5}
.msheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line2);border-radius:18px 18px 0 0;padding:20px 18px 26px;display:flex;flex-direction:column;gap:10px}
.scanner{position:relative;height:300px;border-radius:14px;background:linear-gradient(160deg,#1A1F27,#050608);overflow:hidden}
.scanbox{position:absolute;left:50%;top:44%;width:170px;height:170px;transform:translate(-50%,-50%);border:3px solid var(--red-text);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.qrmini{width:40px;height:40px;flex:none;border-radius:4px;background:repeating-conic-gradient(#050608 0 25%,#fff 0 50%) 0 0/10px 10px;border:3px solid #fff}
/* mobile app — consumer app layout, CivilCamAI brand colours */
.phone{--err:#FF5A63;--errline:#6B1016}
.phone .btn{border-radius:10px;font-weight:800;letter-spacing:.02em} .phone .btn2{border-radius:10px}
.phone .errt{color:var(--err)} .phone .in.err{border-color:#E60B1D} .phone .errbox{border-color:var(--errline);background:#1A0507} .phone .mfail{border-color:var(--errline);color:var(--err);background:#1A0507}
.phone .in{border-radius:10px} .phone .card{border-radius:14px}
.mbtnline{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--red);background:var(--red-wash);color:var(--red-text);font-weight:800;font-size:14px;letter-spacing:.02em;cursor:pointer;width:100%}
.mlogo{width:30px;height:30px;border-radius:8px;border:1px solid var(--red-line);background:var(--red-wash);color:var(--red-text);display:flex;align-items:center;justify-content:center;flex:none}
.mword{font-size:14px;font-weight:800;letter-spacing:.16em} .mword em{font-style:normal;color:var(--red-text)}
.mslogan{font-size:27px;line-height:1.1;font-weight:800;letter-spacing:-.01em;margin:2px 0 0;text-transform:uppercase} .mslogan em{font-style:normal;color:var(--red-text)}
.mrec{width:168px;height:168px;border-radius:50%;border:0;cursor:pointer;align-self:center;margin-top:8px;background:radial-gradient(circle at 35% 30%,#FF5A63,#E60B1D 50%,#9E0714);box-shadow:0 0 0 10px rgba(230,11,29,.10),0 0 70px rgba(230,11,29,.32);display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.mrec::before{content:'';position:absolute;inset:14px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35)}
.mrec i{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.32);display:flex;align-items:center;justify-content:center} .mrec i::after{content:'';width:22px;height:22px;border-radius:50%;background:#fff}
.mrec:active{transform:scale(.97)}
.mreclab{font-size:12px;font-weight:800;letter-spacing:.18em;text-align:center}
.mlink{display:flex;align-items:center;gap:12px;border:1px solid var(--line2);border-radius:12px;padding:14px;background:var(--surface);color:var(--fg);cursor:pointer;text-align:left;width:100%;text-decoration:none}
.mlink.hl{border-color:var(--red-line);background:linear-gradient(90deg,var(--red-wash),var(--surface))}
.mlink:hover{border-color:var(--active-line)}
.mico{width:40px;height:40px;flex:none;border-radius:10px;border:1px solid var(--red-line);background:var(--red-wash);color:var(--red-text);display:flex;align-items:center;justify-content:center}
.mico.g{border-color:var(--line2);background:var(--bg);color:var(--fg2)}
.chv{margin-left:auto;color:var(--muted);transform:rotate(-90deg);display:flex;flex:none}
.msec{font-size:11px;font-weight:800;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-top:8px;display:flex;justify-content:space-between;align-items:center}
.mnav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:#07090D;padding:6px 6px 12px;position:relative;z-index:3}

/* ---------- app pages ---------- */
function appPage(r){
  const u = S.user, sup = u.role==='super';
  if (['roles','protocol','governance'].includes(r) && !sup) return shell('', denied());
  const P = PAGES[r]; if (P && !sup) return shell(r, P());
  if (r==='events') return shell('events', sup ? eventsPage() : portfolioPage());
  if (r==='all-events') return shell('all-events', eventsPage(true));
  if (r==='dashboard') return sup ? shell('dashboard', dashboard()) : shell('', denied());
  if (r==='roles') return shell('roles', rolesPage());
  if (r==='protocol') return shell('protocol', protocolPage());
  if (r==='account') return shell('account', accountPage());
  if (r==='help') return shell('support', supportPage());
  let m;
  if ((m = r.match(/^ready-(EVT-[\w-]+)$/))) return withEvent(m[1], ev => shell('events', readyPage(ev)));
  if ((m = r.match(/^event-(EVT-[\w-]+)$/))) return withEvent(m[1], ev => shell(sup?'all-events':'events', eventPage(ev)));
  if ((m = r.match(/^report-(EVT-[\w-]+)$/))) return withEvent(m[1], ev => shell(sup?'all-events':'events', reportViewer(ev)));
  return shell('', notFound());
}
function canSee(ev){ return S.user.role==='super' || ev.owner===S.user.email; }
function withEvent(id, fn){ const ev = evById(id); if (!ev || ev.deleted || !canSee(ev)) return shell('', notFound()); return fn(ev); }

const denied = () => `<div class="card" style="max-width:560px;margin:40px auto;text-align:center;align-items:center"><span class="tag">403</span><h1>Page not available</h1><p class="muted">This page doesn’t exist or you don’t have access to it.</p><a class="btn2" href="#events">Back to My events</a></div>`;

function privChip(p){ return `<span class="chip">${p}</span>`; }
function eventsPage(all){

/* ---------- workspace ---------- */
const procTone = f => ({Processed:'st-ok',Waiting:'st-g',Processing:'st-w',Failed:'st-r',Quarantined:'st-r'})[f.proc];
const STEPS = ['Receive','Fingerprint','Type check','Metadata','Review copy'];
function procLabel(f){ if (f.proc==='Processing') return 'Processing · '+STEPS[Math.min(f.step,4)]; if (f.proc==='Failed') return 'Failed — '+(f.fail||'a step failed')+'. Our team has been told.'; if (f.proc==='Quarantined') return 'Quarantined — security check'; return f.proc; }
function reviewCell(ev,f){
  const r = ev.review; if (!r || r.state!=='complete') return '<span class="xs muted">Received — not validated</span>';
  if (!r.ids.includes(f.id)) return '<span class="xs muted">Not in this review</span>';
  const x = r.results[f.id]; if (!x) return '';
  return `<span class="xs ${x.tone==='ok'?'st-ok':x.tone==='w'?'st-w':x.tone==='r'?'st-r':'st-g'}" style="font-weight:600">${x.s}${x.score!=null?' · '+x.score:''}</span>`;
}
function workspace(ev){
  const c = counts(ev), sup = S.user.role==='super', rv = reviewView(ev);

  <div class="row sp" style="align-items:flex-start"><div class="col" style="gap:6px;min-width:0"><h1 style="overflow-wrap:anywhere">${esc(ev.title)}</h1>
    <div class="row" style="gap:6px"><span class="mono sm" style="color:var(--fg2)">${ev.id}</span>${privChip(ev.privacy)}${sealed?`<span class="chip r">CivilSealed · ${ev.seal}</span>`:'<span class="chip">Open</span>'}<span class="chip ${ev.uploads?'':'w'}">${ev.uploads?'Uploads open':'Uploads closed'}</span></div></div>
    <div class="row" style="gap:8px"><button class="btn2 sm-btn" data-act="edit" data-id="${ev.id}">Edit</button><button class="btn2 sm-btn" data-act="show-qr" data-id="${ev.id}">QR</button><button class="btn sm-btn" data-act="report" data-id="${ev.id}">Report</button></div></div>

  const strip = `<div class="grid4"><div class="stat"><span class="xs muted">Files received</span><b>${c.files}</b><span class="xs muted">${c.dups?c.dups+' duplicate'+(c.dups>1?'s':''):'no duplicates'}</span></div>
    <div class="stat"><span class="xs muted">Contributors</span><b>${c.contributors}</b><span class="xs muted">${c.anon} anonymous · counted per device</span></div>
    <div class="stat"><span class="xs muted">Photo / video / audio</span><b>${c.photo} / ${c.video} / ${c.audio}</b><span class="xs muted">${c.proc?c.proc+' processing':'all processed'}${c.att?` · <span class="st-r">${c.att} need attention</span>`:''}</span></div>
    <div class="stat"><span class="xs muted">AI coverage</span><b>${rv && rv.r.state==='complete' ? rv.assessed.length+' / '+c.files : 'Not reviewed'}</b><span class="xs muted">${rv && rv.r.at ? 'Reviewed '+clock(rv.r.at) : 'No AI review yet'}</span></div></div>`;
  if (!c.files) return hdr + strip + `<div class="card" style="align-items:center;text-align:center;padding:40px 20px;border-style:dashed"><h2>No files yet</h2><p class="muted" style="max-width:420px">Share the QR so people can start adding evidence. No score, summary, map or timeline until files arrive.</p><div class="row"><button class="btn" data-act="show-qr" data-id="${ev.id}">Show QR</button><button class="btn2" data-act="copy-link" data-id="${ev.id}">Copy link</button></div></div>`;
  return hdr + strip + `<div style="display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px" class="ws-grid">${listPanel(ev)}<div class="col" style="gap:16px">${aiPanel(ev)}${vcPanel(ev)}</div></div>
    <div class="grid2">${mapPanel(ev)}${timelinePanel(ev)}</div>${exportPanel(ev)}
    <style>@media (max-width:1000px){.ws-grid{grid-template-columns:1fr!important}}</style>`;
}
function listPanel(ev){
  const F = S.filter, fs = live(ev).slice().sort((a,b)=>b.rec-a.rec).filter(f => (F.type==='All'||f.type===F.type) && (!F.attention||['Failed','Quarantined'].includes(f.proc)) && (!F.q || (f.name+' '+f.id).toLowerCase().includes(F.q.toLowerCase())) && (!F.who || f.dev===F.who));

    <td class="xs num">${clock(f.rec)}</td><td class="xs num">${f.cap!=null?clock(f.cap):'<span class="muted">not present</span>'}</td><td class="xs"><span class="${procTone(f)}">${procLabel(f)}</span>${f.proc==='Processing'?`<div class="bar" style="margin-top:4px;width:90px"><i style="width:${(f.step/5)*100}%"></i></div>`:''}</td><td>${reviewCell(ev,f)}</td>
    <td>${f.dup?'<span class="chip" style="font-size:10px">Duplicate</span> ':''}${f.typeFlag?'<span class="chip" style="font-size:10px">Type differs from label</span>':''}</td></tr>`).join('');
  return `<div class="card" style="padding:14px 6px 6px"><div class="row sp" style="padding:0 10px"><h3>Live contributions</h3><span class="xs muted" aria-live="polite">● Live · pushed, not polled</span></div>
    <div class="row" style="padding:0 10px;gap:6px">${['All','Photo','Video','Audio'].map(t=>`<button class="chip ${F.type===t?'on':''}" data-act="f-type" data-v="${t}">${t}</button>`).join('')}<button class="chip ${F.attention?'on':''} ${att&&!F.attention?'r':''}" data-act="f-att">Needs attention · ${att}</button>
    ${F.who?`<button class="chip on" data-act="f-who" data-v="">${esc((live(ev).find(f=>f.dev===F.who)||{}).who||'Contributor')} ✕</button>`:''}<input class="in sm" style="min-height:34px;width:200px;margin-left:auto" placeholder="Search file name or ID" aria-label="Search files" id="f-q" value="${esc(F.q)}"></div>

function aiPanel(ev){
  const rv = reviewView(ev), c = counts(ev), r = ev.review;
  const head = `<div class="row sp"><h3>AI Incident Summary</h3></div>`;
  const core = `<span class="xs dim" style="font-style:italic">Validation supports the record. It does not determine what happened.</span>`;
  if (!r || r.state==='none') return `<div class="card">${head}<b>No AI review yet</b><span class="sm muted">A review never starts by itself. Only you or a CivilCamAI super admin can start one.</span>${c.proc?`<div class="warnbox">${c.proc} file${c.proc>1?'s are':' is'} still processing. They’ll be listed “Not in this review — still processing”.</div>`:''}<button class="btn sm-btn" style="align-self:flex-start" data-act="start-review" data-id="${ev.id}">Start AI review</button>${core}</div>`;
  if (r.state==='queued') return `<div class="card">${head}<div class="row"><b>Review queued</b></div><span class="sm muted">Waiting for capacity. Starting it again won’t create a second run.</span><button class="btn sm-btn" disabled style="align-self:flex-start">Review queued…</button></div>`;

  const vsel = S.viewVer && S.viewVer[ev.id], old = vsel && r.versions.find(v=>v.version==vsel);
  if (old) { const fsAll = ev.files; const ass = old.ids.filter(id=>old.results[id] && old.results[id].s.startsWith('Assessed')).length;
    return `<div class="card">${head}<div class="note" style="border-style:solid">Version ${old.version} · <b>Superseded</b> · ${clock(old.at)} — shown exactly as saved. <button class="btn3" data-ver-back="${ev.id}">Back to current</button></div>
      <span class="mono sm" style="color:var(--fg)">${ass}/${old.ids.length} original assets content-assessed · ${clock(old.at)}</span>
      <div>${old.ids.map(id=>{ const f = fsAll.find(x=>x.id===id), x = old.results[id]; return f&&x?`<div class="kv"><span style="color:var(--fg)">${esc(f.name)}</span><span>${x.s}${x.score!=null?' · '+x.score:''} <span class="muted">· ${x.r}</span></span></div>`:''; }).join('')}</div>${core}</div>`; }

    + (newer ? `<span class="eyebrow" style="margin-top:6px">New evidence · ${newer}</span>` + rv.newer.map(f=>`<div class="kv"><span style="color:var(--fg)">${esc(f.name)}</span><span class="muted">Not in this review</span></div>`).join('') : '');
  return `<div class="card">${head}
    ${newer?`<div class="warnbox" role="status"><b>New evidence: review required.</b> ${newer} file${newer>1?'s':''} arrived after this review. <button class="btn3" data-act="start-review" data-id="${ev.id}" style="color:var(--warn-text)">Review new evidence</button></div>`:''}
    ${changed?`<div class="warnbox"><b>Files changed since this review.</b> ${changed} file${changed>1?'s were':' was'} removed. Figures recomputed from current file IDs; the version’s manifest still lists ${changed>1?'them':'it'}.</div>`:''}
    <div class="row sp"><span class="mono sm" style="color:var(--fg)">${rv.assessed.length}/${rv.total} original assets content-assessed · ${clock(r.at)}</span>${r.versions.length?`<select class="in sm" style="min-height:32px;width:auto" data-ver="${ev.id}" aria-label="Review version"><option value="">Version ${r.version} · current</option>${r.versions.slice().reverse().map(v=>`<option value="${v.version}">Version ${v.version} · superseded · ${clock(v.at)}</option>`).join('')}</select>`:`<span class="chip">Version ${r.version}</span>`}</div>
    <p class="sm" style="color:var(--fg2)">${ev.id==='EVT-2026-K7QM-4TR'?'Files received between 8:40 and 9:45 PM are consistent with a crowd surge at the Turn 3 barrier around 8:40 PM. Who or what started it is not established.':`${rv.assessed.length} files were assessed individually.`} ${rv.gaps.length} file${rv.gaps.length===1?' was':'s were'} not assessed — listed below with the reason.</p>
    <details><summary class="sm" style="cursor:pointer;font-weight:600">Per-file results (${rv.inRun.length}${newer?' + '+newer+' new':''})</summary><div style="margin-top:6px">${list}</div></details>
    <span class="xs muted">Model: CivilCamAI Validation Engine v1.0 · Nov 23 · Review method: original-asset AI content review · video review copies · model sampling disclosed.</span>${core}</div>`;
}
function vcPanel(ev){
  const rv = reviewView(ev);
  if (!rv || rv.r.state!=='complete') return `<div class="card"><h3>Validation Center</h3><b>No score yet</b><span class="sm muted">Figures appear only after a completed review. A paused review shows no partial score.</span></div>`;

  const S2 = (n,l,s) => `<div class="stat" style="background:var(--bg)"><span class="xs muted">${l}</span><b style="font-size:20px">${n}</b>${s?`<span class="xs muted">${s}</span>`:''}</div>`;
  return `<div class="card"><div class="row sp"><h3>Validation Center</h3></div>

    <div class="grid2" style="gap:8px">${S2('Not shown','Event score','coming soon')}${S2(cov+'%','Review coverage',rv.assessed.length+' of '+rv.total)}${S2(rv.usable.length,'Usable originals','score of 60 or more')}${S2(rv.gaps.length,'Gaps disclosed','listed in the summary')}</div>
    <span class="xs muted">Review method: original-asset AI content review · video review copies · model sampling disclosed</span>
    <span class="xs dim" style="font-style:italic">Validation supports the record. It does not determine what happened.</span></div>`;
}
function mapPanel(ev){
  const fs = live(ev), withLoc = fs.filter(f=>f.loc||f.bloc).length;
  if (!withLoc) return `<div class="card"><h3>Map</h3><div class="card" style="background:var(--bg);align-items:center;text-align:center;padding:30px"><b>No location data</b><span class="sm muted">None of these files includes a location, and no contributor shared one.</span></div></div>`;
  return `<div class="card"><h3>Map</h3><div class="map" role="img" aria-label="Approximate area of ${withLoc} files"><div style="position:absolute;left:28%;top:20%;width:44%;height:58%;border:2px dashed var(--red);border-radius:50%;background:rgba(230,11,29,.08)"></div><span class="chip r" style="position:absolute;left:44%;top:42%">${withLoc}</span></div>
    <span class="sm muted">Approximate area of ${withLoc} files · <b style="color:var(--fg)">${fs.length-withLoc} files have no location</b>. Exact points: owner and super admins. File and browser locations are labelled separately in each file.</span></div>`;
}
function timelinePanel(ev){
  const fs = live(ev).slice().sort((a,b)=>(a.cap??a.rec)-(b.cap??b.rec)).slice(0,8);
  return `<div class="card"><h3>Timeline</h3><div class="col" style="gap:6px;border-left:2px solid var(--line);padding-left:12px">
    <div class="row xs dim" style="gap:10px"><span class="mono" style="width:70px">7:00 PM</span><b>Event start</b></div>
    ${fs.map(f=>`<button class="row" data-act="file" data-id="${f.id}" style="gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left;flex-wrap:nowrap"><span class="mono xs muted" style="width:70px">${clock(f.cap??f.rec)}</span><span style="width:8px;height:8px;border-radius:4px;background:${f.cap!=null?'var(--red)':'var(--dim)'};flex:none"></span><span class="sm" style="color:var(--fg)">${esc(f.name)}</span>${f.cap==null?'<span class="chip" style="font-size:10px">received time</span>':''}</button>`).join('')}
    </div><span class="xs muted">By capture time; files without one are placed by received time and marked. Shown in the event’s time zone (EST).</span></div>`;
}
function exportPanel(ev){
  const act = (t,d,a,chip) => `<button class="row sp" data-act="${a}" data-id="${ev.id}" style="width:100%;text-align:left;border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--bg);cursor:pointer;flex-wrap:nowrap"><span class="col" style="gap:2px"><b class="sm" style="color:var(--fg)">${t}</b><span class="xs muted">${d}</span></span>${chip||'<span style="color:var(--red-text)">›</span>'}</button>`;
  const last = ev.reports[0];
  return `<div class="card"><div class="row sp"><h3>Export &amp; share</h3><span class="xs muted">${last?'Report last generated '+clock(last.at):'No reports yet'}</span></div>
    <div class="grid2" style="gap:8px">${act('Download PDF report','Executive report from current records','report')}
    ${S.phased?act('Download evidence package','Originals + manifest + fingerprints','package',''):''}
    ${S.phased?act('Share secure link','Tokenized, expiring, revocable','links',''):''}
    ${ev.status==='CivilSealed'?act('Check fingerprints against the seal',ev.seal,'seal-check'):''}
    ${act('Show Event QR code','For more contributions','show-qr')}
    </div>
    ${ev.reports.length?`<span class="eyebrow">Earlier reports</span><div class="col" style="gap:6px">${ev.reports.map(x=>`<div style="border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:2px"><div class="row sp" style="flex-wrap:nowrap"><b class="mono xs">${x.ref}</b><span class="xs muted num">${clock(x.at)} · ${esc(x.by)}</span></div><span class="xs muted">${esc(x.opts)} · ${x.files} files</span></div>`).join('')}</div>`:''}
    ${ev.links.length?`<span class="eyebrow">Secure links</span><div class="tblwrap"><table class="t"><tbody>${ev.links.map((l,i)=>`<tr><td class="sm">${esc(l.label)}</td><td class="xs">Expires ${l.exp}</td><td class="xs">Opened ${l.opens}×</td><td>${l.revoked?'<span class="chip r">Revoked</span>':`<button class="btn3 xs" data-act="revoke" data-id="${ev.id}" data-i="${i}">Revoke</button>`}</td></tr>`).join('')}</tbody></table></div>`:''}</div>`;
}

/* ---------- report viewer ---------- */

function onePager(ev, rp){
  const snap = rp.snap, c = snap.c, rv = snap.rv, done = rv && rv.r && rv.r.state==='complete', fs = snap.files, r = done ? rv.r : null;
  const ok = f => r && r.results[f.id] && r.results[f.id].s.startsWith('Assessed');
  const withLoc = fs.filter(f=>f.loc||f.bloc).length, withCap = fs.filter(f=>f.cap!=null).length;
  const ref = 'CC-2026-11-23-'+rp.ref.replace('RPT-','')+hx(rp.ref,1).toUpperCase();
  const ck = (t, y) => `<div class="ck"><i class="${y?'':'g'}"></i><span>${t}</span></div>`;
  const tl = fs.slice().sort((a,b)=>(a.cap??a.rec)-(b.cap??b.rec)), shown = tl.slice(0,6);
  const photo = fs.find(f=>f.type!=='Audio'), pIdx = photo ? photo.id.charCodeAt(photo.id.length-1)%3 : 0;
  const who = f => rp.names ? esc(f.who) : (f.who==='Anonymous' ? 'Anonymous' : 'Contributor '+snap.whoIdx[f.who]);
  const devs = new Set(fs.map(f=>f.dev)).size;
  const count = (lab, n, t) => { const a = fs.filter(f=>f.type===t), as = a.filter(ok).length; return `<div style="display:grid;grid-template-columns:1fr auto 13cqw;gap:1cqw;align-items:center;padding:.5cqw 0;border-bottom:1px solid #EEF0F3"><b>${lab}</b><b class="rd" style="font-size:2cqw">${n}</b><span class="${as?'ok':'mu'}" style="text-align:right">${n?(done?as+' assessed':'Not reviewed'):'None'}</span></div>`; };
  const summary = !done ? 'No AI review has been run for this event. Every file is listed as “Received — not validated”.'
    : ev.id==='EVT-2026-K7QM-4TR' ? 'Files received between 8:40 and 9:45 PM are consistent with a crowd surge at the Turn 3 barrier around 8:40 PM. Who or what started it is not established.'
    : rv.assessed.length+' file'+(rv.assessed.length===1?' was':'s were')+' assessed individually. Nothing in them establishes what happened beyond what each file shows.';
  return `<div class="rpwrap"><div class="rp1">${rp.prep?`<div class="wm">${esc(rp.prep)}</div>`:''}<div class="rpin">
    <div class="hd"><img src="logo.png" alt="CivilCamAI — Capture. Validate. Defend."><div class="t"><h1>INCIDENT EVIDENCE REPORT</h1><span class="tg">RECEIVED. FINGERPRINTED. ${done?'ASSESSED.':'NOT YET REVIEWED.'}</span></div></div>
    <div class="strip"><div><span class="lb">Report ID</span><b class="rd mono" style="font-size:1.4cqw">${ref}</b></div><div><span class="lb">Report date</span><b style="font-size:1.6cqw">Nov 23, 2026</b><span class="mu">${clock(rp.at)}</span></div>
      <div><span class="lb">Record status</span><b class="rd" style="font-size:1.4cqw">${ev.status==='CivilSealed'?'CivilSealed':'Fingerprinted &amp; custody-logged'}</b></div>
      <div><span class="lb">Review coverage</span><b class="rd" style="font-size:2.4cqw;line-height:1">${done?rv.assessed.length+'/'+rv.total:'—'}</b><span class="mu">${done?'original files content-assessed':'no AI review run'}</span></div></div>
    <div class="r3">
      <div class="bx"><span class="h">Incident overview</span>${[['Event',esc(ev.title)],['Type',esc(ev.type||'Other')],['Date / time',esc(ev.start||'')],['Location',esc(ev.place||'Not given')],['Event ID','<span class="mono">'+ev.id+'</span>'],['Organizer',esc(ev.organizer)]].map(([k,v])=>`<div><b>${k}</b><br><span class="mu">${v}</span></div>`).join('')}</div>
      <div class="bx"><span class="h">Executive summary</span><span>${summary}</span><span class="mu" style="margin-top:auto;font-style:italic">Validation supports the record. It does not determine what happened.</span></div>
      <div class="bx"><span class="h">Location</span>${photo?`<div class="ph" style="background-image:url(${EVIMG[pIdx]})"></div><span class="mu">Representative file · ${esc(photo.name)}</span>`:''}
        <div class="mp">${withLoc?'<b></b>':''}</div><span><b>${withLoc} of ${fs.length}</b> files carry a location${withLoc?' · consistent with the event area':''}.</span><span class="mu">${rp.locs?'Exact points included for the named recipient.':'Approximate area only — exact points left out.'}</span></div></div>
    <div class="r2">
      <div class="bx"><span class="h">Timeline <span class="mu" style="font-weight:600;text-transform:none;letter-spacing:0">· by capture time</span></span><div class="tl">${shown.map(f=>`<div style="display:grid;grid-template-columns:8cqw 1fr;gap:1cqw"><b class="rd">${clock(f.cap??f.rec)}</b><span>${f.type} · ${esc(f.name)}${f.cap==null?' <span class="mu">(received time)</span>':''}</span></div>`).join('')}${tl.length>6?`<span class="mu">+ ${tl.length-6} more in the appendix</span>`:''}${!tl.length?'<span class="mu">No files received.</span>':''}</div>
        <div style="display:flex;gap:1cqw;margin-top:auto"><span class="bx" style="padding:.6cqw 1cqw;flex:1">${withCap} of ${fs.length} with a capture time</span><span class="bx" style="padding:.6cqw 1cqw;flex:1">${withLoc} of ${fs.length} with a location</span></div></div>
      <div class="bx g"><span class="h">Evidence summary</span>${count('Video clips',c.video,'Video')}${count('Images',c.photo,'Photo')}${count('Audio',c.audio,'Audio')}<div style="display:grid;grid-template-columns:1fr auto 13cqw;gap:1cqw;align-items:center;padding:.5cqw 0"><b>Contributors</b><b class="rd" style="font-size:2cqw">${c.contributors}</b><span class="mu" style="text-align:right">${c.anon} anonymous</span></div></div></div>
    <div class="bx"><span class="h">AI review · what was checked ${done?`<span class="mu" style="font-weight:600;text-transform:none;letter-spacing:0">· version ${r.version}</span>`:''}</span>
      ${done?`<div class="r4">
        <div><b>Media integrity</b>${ck('Signs of editing: none found on '+rv.assessed.length+' assessed', true)}${ck(rv.gaps.length?'Not established for '+rv.gaps.length+' file'+(rv.gaps.length>1?'s':''):'Every file in the review assessed', !rv.gaps.length)}${ck('Metadata read on '+fs.filter(f=>f.cap!=null).length+' of '+fs.length, true)}</div>
        <div><b>Chain of custody</b>${ck('SHA-256 fingerprint taken at receipt for all '+fs.length, true)}${ck('Append-only custody log', true)}${ck('Originals kept unchanged', true)}</div>
        <div><b>Consistency across files</b>${ck('Capture times consistent with each other', true)}${ck(withLoc?'Locations consistent with the event area':'Location not established', !!withLoc)}</div>
        <div><b>Multiple sources</b>${ck(c.contributors+' contributor'+(c.contributors===1?'':'s')+' · '+devs+' device'+(devs===1?'':'s'), c.contributors>1)}${ck(c.contributors>1?'No contradictions noted between sources':'Single source — corroboration not established', c.contributors>1)}</div></div>`
      :`<span class="mu">No AI review has been run. Fingerprints and the custody log are still recorded for every file.</span>`}</div>
    <div class="r3">
      <div class="bx g"><span class="h">What the record shows</span><b style="font-size:1.6cqw">${fs.length} file${fs.length===1?'':'s'} received and preserved for this event${done?', '+rv.assessed.length+' assessed':''}.</b><span class="mu">${done?'The files are consistent with each other on the points above. They do not by themselves establish what happened or who was responsible.':'Files are received and fingerprinted but not validated.'}</span></div>
      <div class="bx"><span class="h">For recipients</span>${ck('Per-file fingerprints in the appendix', true)}${ck('Custody log available on request', true)}${ck(done?'Gaps disclosed — '+rv.gaps.length+' not assessed':'No AI review — gaps not assessed', done)}<span class="mu">Whether this evidence is admissible is for the recipient to decide.</span></div>
      <div class="bx"><span class="h">Review details</span>${[['Review version',done?String(r.version):'—'],['Coverage',done?rv.assessed.length+' of '+rv.total:'—'],['Event score','Coming soon'],['Model','CivilCamAI Validation Engine v1.0'],['Prepared for',rp.prep?esc(rp.prep):'Not named']].map(([k,v])=>`<div style="display:flex;justify-content:space-between;gap:1cqw"><span>${k}</span><b class="${k==='Coverage'?'rd':''}" style="text-align:right">${v}</b></div>`).join('')}</div></div>
    <div style="display:flex;align-items:center;gap:2cqw;margin-top:auto">${ev.status==='CivilSealed'?`<span class="seal">CIVIL<br>SEAL</span>`:''}<span class="qr" data-qr="https://civilcamai.ai/r/${ref}" data-size="120"></span><span class="mu" style="flex:1"><b style="color:#14171B">Check this report</b><br>civilcamai.ai/r/${ref}<br>Compares this PDF’s fingerprint with the one we recorded.</span>
      <span style="text-align:right"><span class="lb">Report fingerprint (SHA-256)</span><br><b class="mono rd" style="font-size:1.1cqw">${rp.sha.slice(0,24)}…</b><br><span class="mu">Issued by CivilCamAI Validation Engine v1.0</span></span></div>
  </div><div class="ft"><span>Validation supports the record. It does not determine what happened.</span><span>Any change to this file changes its fingerprint · Page 1 of 2</span></div></div></div>`;
}
function reportViewer(ev){
  const rp = S.lastReport && S.lastReport.ev===ev.id ? S.lastReport : null;
  if (!rp) return `<div class="card"><h2>No report open</h2><a class="btn" href="#event-${ev.id}">Back to workspace</a></div>`;
  const snap = rp.snap, c = snap.c, rv = snap.rv, prep = rp.prep;
  const foot = n => `<div class="pf"><span>${ev.id} · Generated ${stamp(rp.at)} · ${rp.ref}${prep?' · Prepared for '+esc(prep.split(',')[0]):''}</span><span>Validation supports the record; it does not determine what happened.</span><span>Page ${n} of 2</span></div>`;
  const wm = prep ? `<div class="wm">${esc(prep)}</div>` : '';
  const kvp = rows => `<table>${rows.map(([k,v])=>`<tr><td style="color:var(--ink2);width:30%">${k}</td><td style="font-weight:600">${v}</td></tr>`).join('')}</table>`;
  const cover = `<div class="paper">${wm}<div class="pg"><span class="k">CivilCamAI · Executive report</span><span style="font-size:2.1em;font-weight:700;line-height:1.15">${esc(ev.title)}</span><span style="color:var(--ink2)">Actual received records · Validation-supported record; decision-ready evidence</span>
    ${kvp([['Event ID',`<span class="mono">${ev.id}</span>`],['Dates',esc(ev.start)+(ev.end?' – '+esc(ev.end):'')],['Owner',esc(ev.organizer)],['Status',ev.status],['Files',`${c.files} received`],['Review',rv&&rv.r.state==='complete'?`AI review version ${rv.r.version} · ${clock(rv.r.at)}`:'No AI review'],['Records as of',stamp(rp.at)]])}
    ${prep?`<div style="border:1.5px solid var(--ink);padding:.5em .8em;align-self:flex-start;font-weight:700">Prepared for ${esc(prep)}</div>`:''}</div>${foot(1)}</div>`;
  const glance = `<div class="paper">${wm}<div class="pg"><span class="k">At a glance</span><div style="display:flex;gap:2%"><div class="box"><span style="color:var(--ink2)">Files received</span><br><b style="font-size:2em">${c.files}</b></div><div class="box"><span style="color:var(--ink2)">Contributors</span><br><b style="font-size:2em">${c.contributors}</b></div><div class="box"><span style="color:var(--ink2)">Photo / video / audio</span><br><b style="font-size:2em">${c.photo} / ${c.video} / ${c.audio}</b></div></div>
    ${rv&&rv.r.state==='complete'?`<div style="display:flex;gap:2%"><div class="box"><span style="color:var(--ink2)">Review coverage</span><br><b style="font-size:1.6em">${rv.assessed.length} / ${rv.total}</b></div><div class="box"><span style="color:var(--ink2)">Usable originals</span><br><b style="font-size:1.6em">${rv.usable.length}</b></div><div class="box"><span style="color:var(--ink2)">Gaps disclosed</span><br><b style="font-size:1.6em">${rv.gaps.length}</b></div></div><span style="font-size:.85em"><b>Event score</b> — coming soon.</span>`:'<span>No AI review — no score.</span>'}
    <span style="font-size:.85em;color:var(--ink2)">From ${c.files} received records. Exact locations ${rp.locs?'included for the named recipient':'left out — approximate area only'}.</span></div>${foot(2)}</div>`;
  let ai;
  if (!rv || !rv.r.at) ai = `<div style="border:1.5px solid var(--ink);padding:1em;font-weight:700;font-size:1.2em">No AI review has been run for this event.</div><span>No score is shown. Every file in the appendix is listed as “Received — not validated”.</span>`;
  else ai = `${rv.newer.length?`<div style="border:1.5px dashed var(--ink);padding:.6em .8em;font-weight:700">New evidence since this review: ${rv.newer.length} files are not covered and show “Received — not validated”.</div>`:''}
    ${snap.laterPaused?'<div style="border:1.5px solid var(--ink);padding:.6em .8em;font-weight:700">A later review is paused (AI provider unavailable). This report uses version '+rv.r.version+' and shows no score from the paused run.</div>':''}
    <span class="mono" style="font-weight:600">${rv.assessed.length}/${rv.total} original assets content-assessed · ${clock(rv.r.at)}</span>
    <span><b>Findings.</b> ${ev.id==='EVT-2026-K7QM-4TR'?'Files are consistent with a crowd surge at the Turn 3 barrier around 8:40 PM. Who or what started the surge is not established.':rv.assessed.length+' files assessed individually.'}</span>
    <span><b>Gaps (${rv.gaps.length}).</b> ${rv.gaps.map(f=>esc(f.name)+' — '+rv.r.results[f.id].r).join(' · ')||'None'}</span>
    <span style="font-size:.9em"><b>Model note.</b> CivilCamAI Validation Engine v1.0 · Review method: original-asset AI content review · video review copies · model sampling disclosed.</span>`;
  const aiP = `<div class="paper">${wm}<div class="pg"><span class="k">AI summary </span>${ai}</div>${foot(3)}</div>`;
  const rows = snap.files.slice(0,9).map(f => { const x = rv && rv.r.state==='complete' && rv.r.ids.includes(f.id) ? rv.r.results[f.id] : null;
    return `<tr><td style="font-weight:600">${esc(f.name)}<br><span class="mono" style="font-weight:400;color:var(--ink2)">${f.id}</span></td><td>${f.type}</td><td>${f.cap!=null?clock(f.cap):'not present · rec. '+clock(f.rec)}</td><td>${rp.names?esc(f.who):(f.who==='Anonymous'?'Anonymous':'Contributor '+(snap.whoIdx[f.who]))}</td><td class="mono" style="font-size:.7em;word-break:break-all;max-width:12em">${f.fp}</td><td style="font-weight:600">${x?x.s+(x.score!=null?' · '+x.score:''):'Received — not validated'}</td></tr>`; }).join('');
  const app = `<div class="paper">${wm}<div class="pg"><span class="k">Evidence appendix · files 1–${Math.min(9,snap.files.length)} of ${snap.files.length}</span><table style="font-size:.8em"><thead><tr><th>File · ID</th><th>Type</th><th>Captured</th><th>Contributor</th><th>SHA-256 (full)</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table><span style="font-size:.8em;color:var(--ink2)">Appendix count (${snap.files.length}) equals files received on the cover.</span></div>${foot(2)}</div>`;
  return `<div class="row sp"><div class="col" style="gap:4px"><span class="eyebrow r">Report ${rp.ref}</span><h1 style="overflow-wrap:anywhere">CivilCamAI_${ev.id}_20261123-${String(Math.floor(rp.at/60)%24).padStart(2,'0')}${String(Math.floor(rp.at%60)).padStart(2,'0')}.pdf</h1><span class="sm muted">Built from records fetched at ${clock(rp.at)} · no AI review was started · recorded with PDF fingerprint <span class="mono">${rp.sha.slice(0,12)}…</span></span></div>
    <div class="row"><button class="btn" data-act="pdf-dl">Download PDF</button><a class="btn2" href="#event-${ev.id}">Back to workspace</a></div></div>
    <div class="col" style="gap:20px;max-width:860px;width:100%;margin:0 auto">${onePager(ev, rp)}${app}</div>`;
}

/* ---------- staff (super admin) ---------- */
function dashboard(){
  const evs = S.events.filter(e=>!e.deleted), files = evs.reduce((n,e)=>n+live(e).length,0);
  const failed = evs.reduce((n,e)=>n+live(e).filter(f=>f.proc==='Failed').length,0), paused = evs.filter(e=>e.review&&e.review.state==='paused').length;
  const T = (n,l,s) => `<div class="stat"><span class="xs muted">${l}</span><b>${n}</b><span class="xs muted">${s}</span></div>`;
  return `<div class="row sp"><h1>Dashboard</h1><span class="chip">Staff role · granted by CivilCamAI</span></div>
    <div class="grid4">${T(evs.length,'Events','all accounts')}${T(files,'Files received','from server records')}${T(failed,'Failed files','need a re-run')}${T(paused,'Reviews paused','awaiting staff')}</div>
    
    <div class="card"><h3>Recent activity</h3>${auditTable(8)}</div>`;
}
function auditTable(n){ const a = S.audit.slice(0,n); if (!a.length) return '<span class="sm muted">Nothing logged yet in this session. Actions you take appear here.</span>';
  return `<div class="tblwrap"><table class="t"><thead><tr><th>Time</th><th>Who</th><th>What</th><th>Event</th></tr></thead><tbody>${a.map(x=>`<tr><td class="mono xs">${clock(x.at)}</td><td class="xs">${esc(x.who)}</td><td class="xs">${esc(x.what)}</td><td class="mono xs">${esc(x.ev)}</td></tr>`).join('')}</tbody></table></div><span class="xs dim">Append-only — entries can’t be edited or deleted.</span>`; }
function rolesPage(){

function protocolPage(){
  const evs = S.events.filter(e=>!e.deleted);
  const failed = []; evs.forEach(e=>live(e).forEach(f=>{ if(f.proc==='Failed') failed.push([e,f]); }));
  const quar = []; evs.forEach(e=>live(e).forEach(f=>{ if(f.proc==='Quarantined') quar.push([e,f]); }));
  const paused = evs.filter(e=>e.review&&e.review.state==='paused');
  const queue = evs.reduce((n,e)=>n+live(e).filter(f=>f.proc==='Waiting'||f.proc==='Processing').length,0);
  return `<div class="row sp"><h1>Protocol console</h1><span class="chip w">Staff only</span></div>

function protection(){
  const items = [
    {k:'email', t:'Email confirmed', pts:200, done:true},
    {k:'pw', t:'Strong password set', pts:100, done:true},
    {k:'tfa', t:'Turn on 2-step sign-in', pts:250, done:S.tfa, href:'#security'},
    {k:'backup', t:'Export a copy of your data', pts:250, done:!!S.exported, href:'#account'},
  ];
  const score = 200 + items.filter(i=>i.done).reduce((n,i)=>n+i.pts,0);
  const level = score>=850?'Strong':score>=650?'Good':'Getting Started';
  return {items, score, level};
}

function gauge(score){
  const r = 78, c = 2*Math.PI*r, arc = c*0.72, val = arc*Math.min(score,1000)/1000;
  return `<svg viewBox="0 0 200 170" width="220" style="max-width:100%" role="img" aria-label="Account Protection Score ${score} of 1000">
    <defs><linearGradient id="gg" x1="0" x2="1" y1="1" y2="0"><stop offset="0" stop-color="#E60B1D"/><stop offset="1" stop-color="#F5A524"/></linearGradient></defs>
    <g transform="rotate(140 100 100)"><circle cx="100" cy="100" r="${r}" fill="none" stroke="var(--line2)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${arc} ${c}"/>
    <circle cx="100" cy="100" r="${r}" fill="none" stroke="url(#gg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${val} ${c}"/></g>
    <text x="100" y="106" text-anchor="middle" fill="var(--fg)" font-family="Figtree, system-ui, sans-serif" font-weight="800" font-size="40">${score}</text></svg>`;
}

function contribStats(){
  let t=0,a=0,u=0,n=0;
  myEvents().forEach(e=>{ const rv = e.review && e.review.state==='complete' ? e.review : null; live(e).forEach(f=>{ t++; const x = rv && rv.ids.includes(f.id) ? rv.results[f.id] : null;
    if (['Failed','Quarantined'].includes(f.proc) || (x && /Gap|Excluded/.test(x.s))) n++; else if (x && x.s.startsWith('Assessed')) a++; else u++; }); });
  return {t,a,u,n};
}

function advisorPage(){

  const map = {'Game or concert':'Sports / Stadium','Public meeting':'Public Meeting','March or protest':'Demonstration','Something happened to me':'Incident','My property':'Hotel / Property'};

function mapSvg(ev, exact){
  const fs = live(ev), pts = fs.map(f=>({f, g:geo(f.loc)||geo(f.bloc), src:f.loc?'file':'browser'})).filter(x=>x.g);
  const W = 560, H = 300;
  const lats = pts.map(p=>p.g.lat), lngs = pts.map(p=>p.g.lng);
  const cLat = pts.length ? (Math.min(...lats)+Math.max(...lats))/2 : 0, cLng = pts.length ? (Math.min(...lngs)+Math.max(...lngs))/2 : 0;
  const span = Math.max(0.0012, (Math.max(...lats,cLat)-Math.min(...lats,cLat))*1.8, (Math.max(...lngs,cLng)-Math.min(...lngs,cLng))*1.1);
  const X = g => W/2 + (g.lng-cLng)/span*W*0.55, Y = g => H/2 - (g.lat-cLat)/span*H*0.95;
  let streets = ''; for (let i=0;i<9;i++) streets += `<line x1="${i*70-20}" y1="0" x2="${i*70+40}" y2="${H}" stroke="#18202A" stroke-width="${i%3?6:10}"/>`;
  for (let j=0;j<6;j++) streets += `<line x1="0" y1="${j*60+10}" x2="${W}" y2="${j*60-14}" stroke="#18202A" stroke-width="${j%2?6:9}"/>`;
  const col = {Photo:'#FF5A63', Video:'#8FB4FF', Audio:'#F5A524'};
  const xs = pts.map(p=>X(p.g)), ys = pts.map(p=>Y(p.g));
  const area = pts.length ? `<ellipse cx="${(Math.min(...xs)+Math.max(...xs))/2}" cy="${(Math.min(...ys)+Math.max(...ys))/2}" rx="${Math.max(46,(Math.max(...xs)-Math.min(...xs))/2+30)}" ry="${Math.max(36,(Math.max(...ys)-Math.min(...ys))/2+26)}" fill="rgba(230,11,29,.10)" stroke="#E60B1D" stroke-width="2" stroke-dasharray="6 5"/>` : '';
  const pins = exact ? pts.map(p=>`<g class="pin" data-act="file" data-id="${p.f.id}" role="button" aria-label="${esc(p.f.name)}"><title>${esc(p.f.name)} · ${p.f.type} · ${p.src==='file'?'location in file':'browser location'}</title><circle class="o" cx="${X(p.g)}" cy="${Y(p.g)}" r="8" fill="${col[p.f.type]||'#FF5A63'}" stroke="#07090D" stroke-width="2"/>${p.src==='browser'?`<circle cx="${X(p.g)}" cy="${Y(p.g)}" r="13" fill="none" stroke="${col[p.f.type]||'#FF5A63'}" stroke-width="1" stroke-dasharray="2 2"/>`:''}</g>`).join('') : '';
  return `<svg class="mapsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${exact?'Exact points of '+pts.length+' files':'Approximate area of '+pts.length+' files'}"><rect width="${W}" height="${H}" fill="#0C1117"/>${streets}
    <path d="M0 ${H*0.78} C ${W*0.25} ${H*0.68}, ${W*0.45} ${H*0.95}, ${W} ${H*0.82} L ${W} ${H} L 0 ${H} Z" fill="#0E1A26"/>
    <rect x="${W/2-120}" y="${H/2-70}" width="240" height="140" rx="60" fill="#121A22" stroke="#23303D" stroke-width="2"/><text x="${W/2}" y="${H/2-78}" fill="#5E6B78" font-size="11" text-anchor="middle" font-family="sans-serif">${esc((ev.place||'Event area').split(',')[0])}</text>
    ${area}${pins}<text x="${W-10}" y="${H-10}" fill="#5E6B78" font-size="10" text-anchor="end" font-family="sans-serif">Not to scale</text></svg>`;
}

      <div class="bx"><span class="h">Contributor</span><div><b>${esc(r.who)}</b></div><div><b>Location</b><br><span class="mu">${r.loc==='on'?'Shared with the organizer only':'Not shared'}</span></div><div><b>Device</b><br><span class="mu">This phone</span></div></div></div>
    <div class="bx"><span class="h">Files</span><div style="display:grid;grid-template-columns:2.2fr .9fr 1fr 1fr 3fr;gap:.8cqw 1.4cqw;font-size:1.3cqw"><b class="mu">File</b><b class="mu">Type</b><b class="mu">Captured</b><b class="mu">Received</b><b class="mu">SHA-256</b>

function plog(ev, m){ (S.plog[ev.id] ||= []).unshift({t:clock(NOW).replace(/ [AP]M/,''), m}); }
function processFile(ev, f, failAt, from){
  if (from!=null) { f.proc='Processing'; f.step=from; } else { f.proc='Waiting'; f.step=0; } soft();

    if (f.removed) return;
    if (f.proc==='Waiting'){ f.proc='Processing'; f.step=0; plog(ev, f.id+' '+f.name+' · received · '+f.size); }
    else { f.step++; plog(ev, f.id+' · '+(['receive ok','sha256 '+f.fp.slice(0,12)+'… ok','type: '+f.typeRes,'metadata: '+(f.cap!=null?'capture time present':'capture time not present'),'review copy made'][f.step-1]||'step ok')); if (failAt!=null && f.step===failAt){ plog(ev, f.id+' · failed — staff alerted'); f.proc='Failed'; f.fail='couldn’t read the file'; log('Processing failed — staff alerted', ev.id); soft(); return; }
      if (f.step>=5 || (f.step===4 && !f.rc)) { f.proc='Processed'; f.step=5; plog(ev, f.id+' · processed'); soft(); return; } }
    soft(); setTimeout(tick, 650);

}

  'e-priv'(el){ S.draft.privacy = el.dataset.v; render(); },
  'save-edit'(el){ const ev = evById(el.dataset.id), d = S.draft; S.err={}; if (!d.title.trim()) { S.err.title='Add a title — spaces alone don’t count.'; render(); return; }

    if (up) log(d.uploads?'Uploads reopened':'Uploads closed', ev.id); else log('Event edited', ev.id);

  'show-qr'(el){ S.modal={k:'qr', id:el.dataset.id}; render(); },

  'open-original'(){ const d = S.drawer; S.light = d ? {ev:d.ev, f:d.f} : null; render(); },

  'file-nav'(el){ const d = S.drawer, ev = evById(d.ev), o = drawerOrder(ev), i = o.indexOf(d.f) + (+el.dataset.d); if (i>=0 && i<o.length) { d.f = o[i]; S.light = S.light ? {ev:d.ev, f:d.f} : null; render(); } },
  fplay(el){ const t0 = Date.now(), b = document.getElementById('fp-b'), t = document.getElementById('fp-t'); el.textContent = '❚❚'; clearInterval(window.__fp); window.__fp = setInterval(()=>{ const s2 = (Date.now()-t0)/1000, pc = Math.min(100, s2/8*100); if (b) b.style.width = pc+'%'; if (t) t.textContent = '0:'+String(Math.floor(s2*3)).padStart(2,'0'); if (pc>=100) { clearInterval(window.__fp); el.textContent='▶'; } }, 120); },
  'map-mode'(el){ S.mapExact = el.dataset.v==='1'; render(); },
  'f-noloc'(){ S.filter = {type:'All',attention:false,q:'',who:''}; toast('Files without a location are marked in each file’s detail — missing location is a gap, never a sign of fabrication'); },
  'dl-qr'(el){ toast('QR PNG for '+el.dataset.id+' downloaded. Test-scan before printing.'); },
  'copy-code'(el){ copy(evById(el.dataset.id).code, 'Share code copied'); },
  'regen-code'(el){ const ev = evById(el.dataset.id), old = ev.code; ev.code = CODE().slice(0,4); log('Share code regenerated', ev.id); toast('New share code '+ev.code+' — links and QRs with '+old+' stop working'); render(); },
  'fan-view'(el){ const id = el.dataset.id; M.stack=['home']; M.queue=[]; M.receipt=null; M.asOwner=false; M.ev=id; M.screen='event'; go('mobile'); },
  soon(){ toast('Company response is coming soon.'); },
  'seal-check'(){ toast('All files match the seal.'); },
  'f-type'(el){ S.filter.type = el.dataset.v; render(); }, 'f-att'(){ S.filter.attention = !S.filter.attention; render(); }, 'f-clear'(){ S.filter={type:'All',attention:false,q:'',who:''}; render(); },
  'f-who'(el){ S.filter.who = el.dataset.v; render(); if (el.dataset.v) setTimeout(()=>document.getElementById('evtl')?.scrollIntoView({behavior:'smooth',block:'start'}), 30); },
  file(el){ const id = el.dataset.ev || (route().match(/EVT-[\w-]+/)||[])[0]; S.drawer = { ev:id, f:el.dataset.id }; S.modal=null; render(); },
  'start-review'(el){ S.modal={k:'start-review', id:el.dataset.id}; render(); },
  'do-review'(el){ S.modal=null; startReview(evById(el.dataset.id)); render(); },
  remove(el){ S.err={}; S.drawer=null; S.modal={k:'remove', id:el.dataset.id, f:el.dataset.f}; render(); },
  'do-remove'(el){ const reason = val('rm-r').trim(); if (!reason) { S.err={reason:'Give a reason — it’s kept in the log.'}; render(); return; }
    const ev = evById(el.dataset.id), f = ev.files.find(x=>x.id===el.dataset.f); f.removed = {by:S.user.name, at:NOW, reason};
    if (ev.review && ev.review.state==='complete' && ev.review.ids.includes(f.id)) ev.review.removedSince++;
    log('File removed from record · '+f.name+' · “'+reason+'”', ev.id); S.modal=null; toast(f.name+' removed from the record'); render(); },
  'removed-list'(el){ S.modal={k:'removed', id:el.dataset.id}; render(); },
  restore(el){ const ev = evById(el.dataset.id), f = ev.files.find(x=>x.id===el.dataset.f); f.removed=null; if (ev.review && ev.review.removedSince) ev.review.removedSince--; log('File restored · '+f.name, ev.id); S.modal = ev.files.some(x=>x.removed)?S.modal:null; render(); },
  report(el){ S.ropts = { names:false, locs:false, rname:'', rorg:'', busy:false }; S.err={}; S.modal={k:'report-opts', id:el.dataset.id}; render(); },
  'ro-tog'(el){ S.ropts[el.dataset.v] = !S.ropts[el.dataset.v]; render(); },
  'gen-report'(el){ const ev = evById(el.dataset.id), o = S.ropts; S.err={};
    if ((o.names||o.locs) && (!o.rname.trim()||!o.rorg.trim())) { S.err.rname='Add who this report is for before including private details.'; render(); return; }
    o.busy = true; render();
    setTimeout(() => { NOW += 1; const fs = live(ev).slice().sort((a,b)=>a.rec-b.rec); const whoIdx={}; let k=1; fs.forEach(f=>{ if(f.who!=='Anonymous' && !whoIdx[f.who]) whoIdx[f.who]=k++; });
      const rp = { ev:ev.id, at:NOW, ref:'RPT-'+hx(ev.id+NOW,4).toUpperCase(), sha:hx('pdf'+NOW), names:o.names, locs:o.locs, prep:(o.names||o.locs)?o.rname.trim()+', '+o.rorg.trim():'', snap:{ c:counts(ev), rv: (ev.review && ev.review.state!=='complete' && ev.review.prev) ? reviewView({...ev, review:ev.review.prev}) : reviewView(ev), laterPaused: !!(ev.review && ev.review.state==='paused'), files:fs, whoIdx } };
      ev.reports.unshift({ ref:rp.ref, at:rp.at, by:S.user.name, opts:(rp.prep?'Private details on · Prepared for '+rp.prep:'Default'), files:fs.length, sha:rp.sha });
      log('Report generated · '+rp.ref+(rp.prep?' · for '+rp.prep:''), ev.id); note('Report ready', ev.title+' · '+rp.ref, '#report-'+ev.id); S.lastReport = rp; S.modal=null; go('report-'+ev.id); }, 1100); },
  package(){ S.modal={k:'package'}; render(); }, 'pkg-go'(){ S.modal=null; toast('Preparing in the background — we’ll email you when it’s ready.'); render(); },
  links(el){ S.modal={k:'links', id:el.dataset.id}; render(); },
  'make-link'(el){ const ev = evById(el.dataset.id); ev.links.push({label:val('ln-label')||'Reviewer', exp: val('ln-exp')==='In 30 days'?'Dec 23':'Nov 30', opens:0}); log('Secure link created', ev.id); S.modal=null; toast('Secure link created and copied'); render(); },
  revoke(el){ const ev = evById(el.dataset.id); ev.links[+el.dataset.i].revoked = true; log('Secure link revoked', ev.id); toast('Link revoked — it stopped working now'); render(); },
  'save-profile'(){ S.user.name = val('a-name').trim()||S.user.name; log('Profile updated'); toast('Saved'); render(); },
  'change-pw'(){ if (!val('a-cur')||val('a-new').length<10) { toast('Enter your current password and a new one of at least 10 characters'); return; } log('Password changed'); toast('Password changed. Other devices are signed out.'); render(); },
  'export-data'(){ S.exported = true; log('Data export requested'); toast('We’ll email you a download link.'); render(); },
  'delete-acct'(){ S.err={}; S.modal={k:'delete'}; render(); },
  'do-delete'(){ if (val('da-c')!=='DELETE') { S.err={del:'Type DELETE in capitals to confirm.'}; render(); return; } log('Account deleted'); S.modal=null; S.user=null; S.flash='Your account was deleted. We’ve emailed you a confirmation.'; go('signin'); },
  role(el){ S.err={}; S.modal={k:'role', i:+el.dataset.i}; render(); },
  'do-role'(el){ const p = S.staff[+el.dataset.i], r = val('rl-r').trim(); if (!r) { S.err={reason:'Give a reason — it’s kept in the log.'}; render(); return; } p.role = p.role==='Super admin'?'Staff · no admin':'Super admin'; log('Role changed · '+p.name+' → '+p.role+' · “'+r+'”'); S.modal=null; toast('Role updated'); render(); },
  'clear-pause'(el){ const ev = evById(el.dataset.id); ev.review.state='reviewing'; log('Pause cleared by staff', ev.id); toast('Review resumed from file '+(ev.review.progress+1)); render(); setTimeout(()=>ev.review.resume ? ev.review.resume() : null, 200); },
  rerun(el){ const ev = evById(el.dataset.id), f = ev.files.find(x=>x.id===el.dataset.f); log('Staff re-run · '+f.name, ev.id); f.fail=null; f.typeRes='M4A · equivalent (audio/x-m4a)'; processFile(ev, f, null, f.step); render(); toast('Re-running from the failed step — same record, same fingerprint'); },
  close(){ S.light=null; S.modal=null; S.drawer=null; S.err={}; render(); },
  scrim(el, ev){ if (ev.target===el) { if (S.modal && S.modal.k==='create') return ACT['d-cancel'](); ACT.close(); } },
};
Object.assign(ACT_EXTRA, {
  archive(el){ const ev = evById(el.dataset.id); ev.archived = true; ev.uploads = false; log('Event archived', ev.id); S.modal=null; S.draft=null; toast('Archived — find it under the Archived tab'); go('events'); },
  unarchive(el){ const ev = evById(el.dataset.id); ev.archived = false; log('Event restored from archive', ev.id); toast('Restored — uploads stay closed until you reopen them'); render(); },
  'del-event'(el){ const ev = evById(el.dataset.id); if (live(ev).length) { S.err={del:'Can’t delete: this event holds evidence under its retention period. Archive it instead — the record and seals stay intact.'}; render(); return; }
    ev.deleted = true; log('Event deleted', ev.id); S.modal=null; S.draft=null; toast('Event deleted — its QR and link now show “Event not found”'); go('events'); },
});
Object.assign(ACT, ACT_EXTRA);
function signIn(u){ S.user = {...u}; S.flash=null; S.siEmail=null; S.info=null; log('Signed in'); const to = S.returnTo && !AUTH_FREE.includes(S.returnTo) ? S.returnTo : (u.role==='super'?'dashboard':'home'); S.returnTo=null; go(to); }
function copy(text, ok){ const done = () => toast(ok); try { navigator.clipboard.writeText(text).then(done, () => { fallback(); }); } catch(e){ fallback(); } function fallback(){ const t = document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select(); try{ document.execCommand('copy'); }catch(e){} t.remove(); toast(ok + ' (select-and-copy fallback)'); } }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if ((S.umenu||S.trust||S.navOpen) && !e.target.closest('.menu')) { S.umenu=false; S.trust=false; if (!e.target.closest('.nav')) S.navOpen=false; render(); } return; }
  if (!['usermenu','trust','burger'].includes(el.dataset.act)) { S.umenu=false; S.trust=false; }
  const a = el.dataset.act; if (!ACT[a]) return;
  if (el.tagName==='A' && el.getAttribute('href')==='#events' && a==='create') e.preventDefault();
  if (a!=='d-fail' && a!=='scrim') e.preventDefault();
  ACT[a](el, e);
});
document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target.dataset.form; S.err = {};
  if (f==='signin') { const em = val('si-email').trim(), pw = val('si-pw'); S.siEmail = em;
    if (!/^\S+@\S+\.\S+$/.test(em)) S.err.email = 'Enter a full email address, like name@example.com.';
    if (!pw) S.err.pw = 'Enter your password.';
    if (Object.keys(S.err).length) return render();
    if (S.lockUntil && S.fails>=5) { S.err.form = 'Too many attempts. Wait 15 minutes or reset your password.'; return render(); }
    if (em===S.signupEmail && !S.confirmed) { S.err.unconf = true; return render(); }
    if (em===S.signupEmail) return signIn({name:S.signupName||'New Owner', email:em, type:(S.accType||{})[em]||'', role:'owner'});
    if (em==='anand@example.com' && pw!=='example-password') { S.fails = (S.fails||0)+1; S.err.form = S.fails>=5 ? 'Too many attempts. Wait 15 minutes or reset your password.' : 'That email and password don’t match.'; if (S.fails>=5) S.lockUntil = 1; return render(); }
    if (em==='anand@example.com') { S.fails = 0; return signIn(OWNER); }
    if (em.endsWith('@civilcamai.ai')) return signIn(SUPER);
    S.err.form = 'That email and password don’t match.'; return render(); }
  if (f==='signup') { const em = val('su-email').trim();
    if (!/^\S+@\S+\.\S+$/.test(em)) S.err.email = 'Enter a full email address, like name@example.com.';
    if (val('su-pw').length < 10) S.err.pw = 'Too short — use at least 10 characters.';
    if (!document.getElementById('su-terms').checked) S.err.terms = 'Accept the terms to continue.';
    if (Object.keys(S.err).length) return render();
    S.signupEmail = em; S.signupName = val('su-name').trim() || 'New Owner'; log('Account created — awaiting email confirmation'); go('check-email'); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.d && S.draft) { S.draft[t.dataset.d] = t.value; if (t.id==='c-title') { const n = document.getElementById('c-title-n'); if (n) n.textContent = t.value.length+' / 120'; } }
  if (t.dataset.ro && S.ropts) S.ropts[t.dataset.ro] = t.value;
  if (t.id==='e-q') { S.efilter.q = t.value; const pos = t.selectionStart; render(); const n = document.getElementById('e-q'); if (n){ n.focus(); n.setSelectionRange(pos,pos); } }
  if (t.id==='cf-q') { (S.cfilter ||= {state:'All'}).q = t.value; const pos = t.selectionStart; render(); const n = document.getElementById('cf-q'); if (n){ n.focus(); n.setSelectionRange(pos,pos); } }
  if (t.id==='f-q') { S.filter.q = t.value; const pos = t.selectionStart; render(); const n = document.getElementById('f-q'); if (n){ n.focus(); n.setSelectionRange(pos,pos); } }
});
document.addEventListener('change', e => { const t = e.target; if (t.dataset && 'cfev' in t.dataset) { (S.cfilter ||= {state:'All'}).ev = t.value; render(); return; } if (t.dataset && t.dataset.ver) { (S.viewVer ||= {})[t.dataset.ver] = t.value ? +t.value : null; render(); } });
document.addEventListener('click', e => { const b = e.target.closest('[data-ver-back]'); if (b) { (S.viewVer ||= {})[b.dataset.verBack] = null; render(); } });
document.addEventListener('keydown', e => { if (S.drawer && !S.modal && (e.key==='ArrowRight'||e.key==='ArrowLeft') && !/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName||'')) { ACT['file-nav']({dataset:{d:e.key==='ArrowRight'?'1':'-1'}}); return; } if (e.key==='Escape' && S.light) { S.light=null; render(); return; } if (e.key==='Escape' && (S.modal||S.drawer)) { if (S.modal && S.modal.k==='create') ACT['d-cancel'](); else ACT.close(); } });

/* first-sign-in: route new users through account type */
const _go = go;
go = function(h){ if (S.user && S.user.role==='owner' && !S.user.type && h!=='account-type' && !AUTH_FREE.includes(h)) { S.returnTo = h; h = 'account-type'; } _go(h); };

/* ============ prototype panel ============ */
function renderProto(){
  const p = document.getElementById('proto'), sup = S.user && S.user.role==='super';
  if (['start','mobile'].includes(route())) { p.innerHTML=''; return; }
  const evId = (route().match(/EVT-[\w-]+/)||[])[0], ev = evId && evById(evId), rv = ev && ev.review;
  p.innerHTML = (S.protoOpen ? `<div class="proto-panel" role="region" aria-label="Demo controls"><div class="row sp"><b>Demo controls</b><button data-pact="close" style="padding:2px 8px" aria-label="Close">✕</button></div>
    <span>View as</span><div class="seg"><button class="${S.user&&!sup?'on':''}" data-pact="owner">Event owner</button><button class="${sup?'on':''}" data-pact="super">Super admin</button></div>
    ${S.user&&!sup?`<span><b>Owner journey</b> · jump to a stage</span><div class="seg" style="grid-template-columns:1fr 1fr">${[['1','Get started'],['2','Create'],['3','Share'],['4','Run it live'],['5','Inspect'],['6','Review'],['7','Report'],['9','Account']].map(([n,l])=>`<button data-pact="stage" data-v="${n}">${n} · ${l}</button>`).join('')}</div>`:''}
    <button data-pact="contrib">Simulate a new contribution${ev?'':' (first event)'}</button>
    <button data-pact="contrib-fail">Simulate a contribution that fails processing</button>
    <button data-pact="pause" ${rv&&rv.state==='reviewing'?'':''}>${S.pauseNext?'✓ Next review will pause':'Pause the next review (provider limit)'}</button>
    <button data-pact="offline" class="${S.offline?'on':''}">${S.offline?'✓ Live connection dropped — tap to reconnect':'Drop the live connection'}</button>
    <button data-pact="restrict" class="${S.restricted?'on':''}">${S.restricted?'✓ Account restricted (can’t create)':'Restrict this account from creating'}</button>
    <button data-pact="phased">${S.phased?'Hide':'Show'} package and secure-link exports</button>
    ${ev&&ev.status!=='CivilSealed'&&rv&&rv.state==='complete'?'<button data-pact="seal">Mark this event CivilSealed</button>':''}
    <button data-pact="start">← Back to start</button>
    <button data-pact="newuser">Start as a brand-new account</button>
    <button data-pact="reset">Reset demo data</button>
    <span style="color:#6B5B1E"><b>Demo logins</b><br>Owner: anand@example.com / example-password<br>Super admin: troy@civilcamai.ai / any password<br>Invite-only share code: 7K2Q</span></div>` : '') +
    `<button class="proto-pill" data-pact="toggle" aria-expanded="${S.protoOpen}">Demo</button>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-pact]'); if (!b) return; const a = b.dataset.pact;
  if (a==='toggle') S.protoOpen = !S.protoOpen;
  if (a==='close') S.protoOpen = false;
  if (a==='owner') { S.user = {...OWNER}; go('home'); }
  if (a==='super') { S.user = {...SUPER}; log('Signed in'); go('dashboard'); }
  if (a==='contrib') { if (!S.user) S.user={...OWNER}; simulateContribution(); }
  if (a==='contrib-fail') { if (!S.user) S.user={...OWNER}; S.failNext = true; simulateContribution(); }
  if (a==='pause') { S.pauseNext = !S.pauseNext; }
  if (a==='phased') S.phased = !S.phased;
  if (a==='seal') { const ev = evById((route().match(/EVT-[\w-]+/)||[])[0]); ev.status='CivilSealed'; ev.seal='CIV-2026-1123-'+String(417+S.events.indexOf(ev)).padStart(5,'0'); ev.sealIds=[...ev.review.ids]; log('CivilSeal created · '+ev.seal, ev.id); }
  if (a==='start') { S.protoOpen=false; go('start'); return; }
  if (a==='offline') { S.offline = !S.offline; if (!S.offline) toast('Reconnected — reloaded from the server'); }
  if (a==='restrict') S.restricted = !S.restricted;
  if (a==='stage') { const n = b.dataset.v, K = 'EVT-2026-K7QM-4TR'; S.protoOpen = false;
    if (n==='1') { S.user=null; S.flash=null; go('signup'); return; }
    if (n==='2') { go('events'); setTimeout(()=>ACT.create(), 60); return; }
    if (n==='3') { go('ready-'+K); return; }
    if (n==='4') { go('event-'+K); return; }
    if (n==='5') { go('event-'+K); setTimeout(()=>{ S.drawer={ev:K, f:evById(K).files[0].id}; render(); }, 60); return; }
    if (n==='6') { go('event-'+K); setTimeout(()=>document.querySelector('.sectitle')?.scrollIntoView({block:'start'}), 120); return; }
    if (n==='7') { go('event-'+K); setTimeout(()=>ACT.report({dataset:{id:K}}), 60); return; }
    if (n==='9') { go('account'); return; } }
  if (a==='newuser') { S.events.forEach(ev=>{ if(!ev.owner) ev.owner='anand@example.com'; }); S.user=null; S.signupEmail=''; S.flash=null; go('signup'); }
  if (a==='reset') { S.events = seed(); S.audit=[]; S.lastReport=null; S.visitLogged={}; S.dispo={}; S.guardians=[]; S.tfa=false; S.exported=false; toast('Demo data reset'); }
  render();
});

render();
